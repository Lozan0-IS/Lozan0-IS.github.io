<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hero model 2 — Projector — AKAI</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="/heroes/base.css">
    <style>
        /* A dark room, one beam. The wordmark exists faintly everywhere and is fully lit only where the light falls. */
        body { background: #000; color: #fff; }

        .stage {
            --x: 62%;
            --y: 46%;
            --beam: clamp(150px, 24vw, 380px);
            position: relative;
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            cursor: crosshair;
            touch-action: pan-y;
        }

        .top { position: absolute; z-index: 3; inset: 1.25rem var(--pad) auto; display: flex; justify-content: space-between; align-items: center; min-height: 44px; }
        .logo { font-size: 1rem; letter-spacing: 0.02em; }

        .word { position: absolute; inset: 0; display: grid; place-items: center; user-select: none; }

        .word span {
            grid-area: 1 / 1;
            font-size: clamp(6rem, 43vw, 66rem);
            font-weight: 300;
            line-height: 0.8;
            letter-spacing: -0.07em;
            white-space: nowrap;
            transform: translateY(-4%);
        }

        .word__dim { color: rgba(255, 255, 255, 0.1); }

        .word__lit {
            color: #fff;
            -webkit-mask-image: radial-gradient(circle var(--beam) at var(--x) var(--y), #000 0%, rgba(0, 0, 0, 0.55) 45%, transparent 100%);
            mask-image: radial-gradient(circle var(--beam) at var(--x) var(--y), #000 0%, rgba(0, 0, 0, 0.55) 45%, transparent 100%);
        }

        /* The beam's own hot spot on the black, very faint */
        .stage::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(circle calc(var(--beam) * 0.6) at var(--x) var(--y), rgba(255, 255, 255, 0.07), transparent 100%);
        }

        .manifesto {
            position: absolute;
            z-index: 3;
            left: var(--pad);
            bottom: clamp(1.25rem, 4vh, 3rem);
            max-width: 15ch;
            font-family: var(--font-serif);
            font-size: clamp(1.75rem, 3.6vw, 3.75rem);
            line-height: 1;
            letter-spacing: -0.05em;
        }

        .links { position: absolute; z-index: 3; right: var(--pad); bottom: 1rem; display: flex; gap: 20px; }

        .hint { position: absolute; z-index: 3; left: var(--pad); top: 5rem; color: rgba(255, 255, 255, 0.55); }
    </style>
</head>
<body>
    <main class="stage" id="stage">
        <header class="top">
            <a class="logo" href="/heroes/" aria-label="AKAI">AKAI</a>
            <p class="mono">Santiago, DR</p>
        </header>

        <h1 class="word">
            <span class="sr-only">AKAI</span>
            <span class="word__dim" aria-hidden="true">AKAI</span>
            <span class="word__lit" aria-hidden="true">AKAI</span>
        </h1>

        <p class="hint mono" aria-hidden="true">Move the light</p>
        <p class="manifesto">Technology is our medium. The experience is the result.</p>
        <nav class="links" aria-label="Main">
            <a class="ghost" href="/#studio">Studio</a>
            <a class="ghost" href="/#contact">Contact</a>
        </nav>
    </main>
    <a class="back mono" href="/heroes/">← All models</a>

    <script>
        (() => {
            const stage = document.getElementById('stage');
            const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
            let lastMove = 0;
            const set = (x, y) => { stage.style.setProperty('--x', x + 'px'); stage.style.setProperty('--y', y + 'px'); };

            stage.addEventListener('pointermove', (e) => {
                const r = stage.getBoundingClientRect();
                set(e.clientX - r.left, e.clientY - r.top);
                lastMove = performance.now();
            });

            // Without a pointer (touch, idle, or a visitor who has stopped), the beam drifts on its own
            if (!reduced) {
                const drift = (t) => {
                    if (t - lastMove > 2200) {
                        const w = stage.clientWidth, h = stage.clientHeight;
                        set(w * (0.5 + 0.32 * Math.sin(t / 2600)), h * (0.46 + 0.16 * Math.sin(t / 1900 + 1)));
                    }
                    requestAnimationFrame(drift);
                };
                requestAnimationFrame(drift);
            }
        })();
    </script>
</body>
</html>
