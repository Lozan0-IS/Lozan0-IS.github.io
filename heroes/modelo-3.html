<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hero model 3 — Departure board — AKAI</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="/heroes/base.css">
    <style>
        /* The four letters are split-flap tiles that spin through the alphabet and land on the name.
           It reuses the site's Santiago clock as its idea, at hero scale. */
        body { background: #000; color: #fff; }

        .hero {
            min-height: 100vh;
            min-height: 100dvh;
            display: grid;
            grid-template-rows: auto 1fr auto;
            padding: 1.25rem var(--pad) 4rem;
            gap: 1.5rem;
        }

        .top { display: flex; justify-content: space-between; align-items: center; min-height: 44px; }
        .logo { font-size: 1rem; letter-spacing: 0.02em; }

        .board { align-self: center; display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(0.4rem, 1vw, 1rem); }

        .tile {
            position: relative;
            display: grid;
            place-items: center;
            aspect-ratio: 3 / 4;
            background: #0c0c0c;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 6px;
            overflow: hidden;
            perspective: 600px;
        }

        .tile__face {
            font-size: clamp(5rem, 19vw, 24rem);
            font-weight: 600;
            line-height: 1;
            letter-spacing: -0.04em;
            will-change: transform;
        }

        /* The hinge every split-flap tile has */
        .tile::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: #000; }

        .meta { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 1rem; }
        .tagline { font-weight: 300; font-size: clamp(1.25rem, 2.6vw, 2.5rem); letter-spacing: -0.03em; }
        .steps { display: flex; gap: 1.25rem; list-style: none; color: rgba(255, 255, 255, 0.6); }

        .replay { background: none; border: 0; color: inherit; cursor: pointer; min-height: 44px; padding: 0; }

        .links { position: fixed; right: var(--pad); bottom: 1rem; display: flex; gap: 20px; mix-blend-mode: difference; color: #fff; }

        @media (max-width: 640px) {
            .board { grid-template-columns: repeat(2, 1fr); }
            .tile__face { font-size: 34vw; }
        }
    </style>
</head>
<body>
    <main class="hero">
        <header class="top">
            <a class="logo" href="/heroes/" aria-label="AKAI">AKAI</a>
            <button class="replay mono" id="replay" type="button">Replay ↻</button>
        </header>

        <h1 class="board" aria-label="AKAI" id="board">
            <span class="tile" aria-hidden="true"><span class="tile__face">A</span></span>
            <span class="tile" aria-hidden="true"><span class="tile__face">K</span></span>
            <span class="tile" aria-hidden="true"><span class="tile__face">A</span></span>
            <span class="tile" aria-hidden="true"><span class="tile__face">I</span></span>
        </h1>

        <div class="meta">
            <p class="tagline">Creative Intelligence Studio</p>
            <ol class="steps mono" aria-label="How we work">
                <li>Think</li><li>Shape</li><li>Build</li><li>Move</li>
            </ol>
        </div>
    </main>

    <nav class="links" aria-label="Main">
        <a class="ghost" href="/#studio">Studio</a>
        <a class="ghost" href="/#contact">Contact</a>
    </nav>
    <a class="back mono" href="/heroes/">← All models</a>

    <script>
        (() => {
            const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
            const faces = [...document.querySelectorAll('.tile__face')];
            const final = 'AKAI'.split('');
            const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            let timers = [];

            // One flip: the glyph folds flat, the character changes at the fold, then it opens again
            const flip = (face, char) => {
                if (!face.animate) { face.textContent = char; return; }
                face.animate([{ transform: 'scaleY(1)' }, { transform: 'scaleY(0.06)' }, { transform: 'scaleY(1)' }], { duration: 110, easing: 'ease-in-out' });
                setTimeout(() => { face.textContent = char; }, 55);
            };

            const run = () => {
                timers.forEach(clearTimeout);
                timers = [];
                if (reduced) { faces.forEach((f, i) => { f.textContent = final[i]; }); return; }
                faces.forEach((face, i) => {
                    const flips = 7 + i * 5;
                    for (let n = 0; n <= flips; n++) {
                        const char = n === flips ? final[i] : alphabet[Math.floor(Math.random() * 26)];
                        timers.push(setTimeout(() => flip(face, char), 250 + n * 95 + i * 120));
                    }
                });
            };

            document.getElementById('replay').addEventListener('click', run);
            run();
        })();
    </script>
</body>
</html>
