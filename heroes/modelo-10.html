<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hero model 10 — Sentence on a blueprint with the portal mark — AKAI</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="/heroes/base.css">
    <style>
        /* Models 7 and 8 together: "We build ___" where each word is drawn like a typographic specimen.
           The guides are the real vertical metrics of the typeface (ascender, x-height, baseline, descender),
           measured in the browser, and the number in the margin is the width of the word on screen. */
        body { background: #000; color: #fff; }

        .hero { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-rows: auto auto 1fr auto; padding: 1.25rem var(--pad) 4.5rem; gap: 0.5rem; }

        .top { display: flex; justify-content: space-between; align-items: center; min-height: 44px; }
        /* The portal icon as the logo: your icon is a window onto two dot grids drifting against each other */
        .logo { --s: clamp(60px, 5vw, 80px); display: inline-block; width: var(--s); height: var(--s); border-radius: 12%; }
        .logo:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
        .mark {
            position: relative;
            display: block;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            -webkit-mask-image: url('/assets/akai-icon.png');
            mask-image: url('/assets/akai-icon.png');
            -webkit-mask-size: 100% 100%;
            mask-size: 100% 100%;
            -webkit-mask-mode: luminance;
            mask-mode: luminance;
            transition: transform 500ms var(--ease-out);
        }
        .mark i { position: absolute; inset: -30%; }
        .mark i:nth-child(1) { background: radial-gradient(circle, #fff 0.7px, transparent 1.1px) 0 0 / 3.4px 3.4px; animation: spin-a 30s linear infinite; }
        .mark i:nth-child(2) { background: radial-gradient(circle, #fff 0.7px, transparent 1.1px) 0 0 / 3.65px 3.65px; mix-blend-mode: difference; animation: spin-b 42s linear infinite reverse; }
        @keyframes spin-a { to { transform: rotate(360deg); } }
        @keyframes spin-b { to { transform: rotate(-360deg); } }
        @media (hover: hover) and (pointer: fine) { .logo:hover .mark { transform: scale(1.08) rotate(-4deg); } }
        @media (prefers-reduced-motion: reduce) { .mark i { animation: none; } }
        .top p { color: rgba(255, 255, 255, 0.6); }

        .lead { align-self: end; margin-top: clamp(1rem, 5vh, 3rem); font-family: var(--font-serif); font-weight: 400; font-size: clamp(2.5rem, 7vw, 7.5rem); line-height: 0.95; letter-spacing: -0.055em; transition: opacity 600ms ease; }

        .spec { align-self: center; width: 100%; height: auto; max-height: 60vh; overflow: visible; }

        .guide { stroke: rgba(255, 255, 255, 0.3); stroke-width: 1; stroke-dasharray: 2000; stroke-dashoffset: 2000; animation: draw 1.3s var(--ease-out) forwards; }
        .guide--v { stroke: rgba(255, 255, 255, 0.22); }
        .guide:nth-of-type(2) { animation-delay: 0.1s; }
        .guide:nth-of-type(3) { animation-delay: 0.2s; }
        .guide:nth-of-type(4) { animation-delay: 0.3s; }
        .guide:nth-of-type(5) { animation-delay: 0.4s; }

        .word { font-family: var(--font-serif); font-style: italic; font-weight: 400; letter-spacing: -0.04em; fill: #fff; fill-opacity: 0; stroke: #fff; stroke-width: 1.5; stroke-dasharray: 4000; stroke-dashoffset: 4000; }

        .tick { font-family: var(--font-mono); font-size: 15px; letter-spacing: 0.1em; text-transform: uppercase; fill: rgba(255, 255, 255, 0.55); opacity: 0; animation: show 0.6s 1.2s ease forwards; }
        .dim { stroke: rgba(255, 255, 255, 0.5); stroke-width: 1; }
        .dimline { transition: opacity 400ms ease; }

        @keyframes draw { to { stroke-dashoffset: 0; } }
        @keyframes show { to { opacity: 1; } }

        .meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.5rem 1.5rem; color: rgba(255, 255, 255, 0.6); }
        .meta b { font-weight: 400; color: #fff; }

        .links { position: fixed; right: var(--pad); bottom: 1rem; display: flex; gap: 20px; mix-blend-mode: difference; color: #fff; z-index: 10; }

        @media (max-width: 640px) {
            .tick, .dimline text { display: none; }
            .meta span:nth-child(2) { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            .guide { stroke-dashoffset: 0; animation: none; }
            .tick { opacity: 1; animation: none; }
        }
    </style>
</head>
<body>
    <main class="hero">
        <header class="top">
            <a class="logo" href="/heroes/" aria-label="AKAI — back to all models"><span class="mark" aria-hidden="true"><i></i><i></i></span></a>
            <p class="mono">Creative Intelligence Studio</p>
        </header>

        <h1 class="lead" id="lead" aria-label="We build brands, websites, platforms, automations and experiences.">We build</h1>

        <svg class="spec" id="spec" viewBox="60 120 1380 410" aria-hidden="true" focusable="false">
            <line class="guide guide--v" x1="60" y1="0" x2="60" y2="520"/>
            <line class="guide" id="g-asc" x1="60" y1="150" x2="1440" y2="150"/>
            <line class="guide" id="g-xh" x1="60" y1="250" x2="1440" y2="250"/>
            <line class="guide" id="g-base" x1="60" y1="380" x2="1440" y2="380"/>
            <line class="guide" id="g-desc" x1="60" y1="440" x2="1440" y2="440"/>

            <text class="tick" id="t-asc" x="1436" y="144" text-anchor="end">Ascender</text>
            <text class="tick" id="t-xh" x="1436" y="244" text-anchor="end">X-height</text>
            <text class="tick" id="t-base" x="1436" y="374" text-anchor="end">Baseline</text>
            <text class="tick" id="t-desc" x="1436" y="434" text-anchor="end">Descender</text>

            <text class="word" id="word" x="60" y="380" font-size="260">brands.</text>

            <g class="dimline" id="dimline" opacity="0"></g>
        </svg>

        <div class="meta mono">
            <span id="readout"><b>01 / 05</b> · brands · 6 glyphs</span>
            <span>Technology is our medium. The experience is the result.</span>
            <span>Santiago, DR · <time id="clock"></time></span>
        </div>
    </main>

    <nav class="links" aria-label="Main">
        <a class="ghost" href="/#studio">Studio</a>
        <a class="ghost" href="/#contact">Contact</a>
    </nav>
    <a class="back mono" href="/heroes/">← All models</a>

    <script>
        (() => {
            const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
            const NS = 'http://www.w3.org/2000/svg';
            const BASELINE = 380;
            const FIT_WIDTH = 1210;   // the widest serif word fills this much of the drawing

            // The name comes first, in the brand's own typeface; then the sentence, in serif. Each lap starts with the name.
            const BRAND = { text: 'AKAI', family: '"Space Grotesk", system-ui, sans-serif', style: 'normal', weight: 300, spacing: '-0.06em', size: 365 };
            const SERIF = { family: '"Times New Roman", Times, serif', style: 'italic', weight: 400, spacing: '-0.04em' };
            const WORDS = ['brands', 'websites', 'platforms', 'automations', 'experiences'];

            const word = document.getElementById('word');
            const lead = document.getElementById('lead');
            const dimline = document.getElementById('dimline');
            const readout = document.getElementById('readout');
            const $ = (id) => document.getElementById(id);

            const ctx = document.createElement('canvas').getContext('2d');
            const measure = (text, f, size) => { ctx.font = `${f.style} ${f.weight} ${size}px ${f.family}`; return ctx.measureText(text); };

            const longest = WORDS.reduce((a, b) => (b.length > a.length ? b : a)) + '.';
            SERIF.size = Math.min(300, Math.floor(FIT_WIDTH / (measure(longest, SERIF, 100).width / 100)));

            // Each typeface puts its guides in a different place, so they are measured per face and slide between faces
            const metrics = (f) => ({
                asc: measure('h', f, f.size).actualBoundingBoxAscent,
                xh: measure('x', f, f.size).actualBoundingBoxAscent,
                desc: measure('p', f, f.size).actualBoundingBoxDescent
            });
            const GUIDES = { asc: 'g-asc', xh: 'g-xh', base: 'g-base', desc: 'g-desc' };
            let armed = false;
            const placeGuides = (f) => {
                const m = metrics(f);
                const ys = { asc: BASELINE - m.asc, xh: BASELINE - m.xh, base: BASELINE, desc: BASELINE + m.desc };
                for (const k in GUIDES) {
                    const line = $(GUIDES[k]), label = $('t-' + k);
                    if (!armed) { line.setAttribute('y1', 0); line.setAttribute('y2', 0); label.setAttribute('y', 0); }
                    line.style.transform = `translateY(${ys[k]}px)`;
                    label.style.transform = `translateY(${ys[k] - 6}px)`;
                }
                armed = true;
                requestAnimationFrame(() => document.querySelectorAll('.guide, .tick').forEach((el) => { el.style.transition = 'transform 800ms cubic-bezier(0.16, 1, 0.3, 1)'; }));
                return m;
            };
            $('t-asc').textContent = 'Ascender';

            const dimension = (descent) => {
                const b = word.getBBox();
                const y = BASELINE + descent + 44;
                dimline.replaceChildren();
                const add = (tag, attrs, cls) => { const el = document.createElementNS(NS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); if (cls) el.setAttribute('class', cls); dimline.append(el); return el; };
                add('line', { x1: b.x, y1: y, x2: b.x + b.width, y2: y }, 'dim');
                add('line', { x1: b.x, y1: y - 7, x2: b.x, y2: y + 7 }, 'dim');
                add('line', { x1: b.x + b.width, y1: y - 7, x2: b.x + b.width, y2: y + 7 }, 'dim');
                const t = add('text', { x: b.x + b.width / 2, y: y + 26, 'text-anchor': 'middle' }, 'tick');
                t.textContent = `${Math.round(b.width)} units`;
                t.style.opacity = 1; t.style.animation = 'none';
                return Math.round(b.width);
            };

            const items = [{ kind: 'brand', text: BRAND.text }, ...WORDS.map((w) => ({ kind: 'serif', text: w }))];
            let index = 0;

            const show = (i) => {
                const it = items[i];
                const f = it.kind === 'brand' ? BRAND : { ...SERIF };
                const size = it.kind === 'brand' ? BRAND.size : SERIF.size;
                word.style.fontFamily = f.family;
                word.style.fontStyle = f.style;
                word.style.fontWeight = f.weight;
                word.style.letterSpacing = f.spacing;
                word.setAttribute('font-size', size);
                word.textContent = it.kind === 'brand' ? it.text : it.text + '.';
                lead.style.opacity = it.kind === 'brand' ? 0 : 1;

                const m = placeGuides({ ...f, size });
                const width = dimension(m.desc);
                const face = it.kind === 'brand' ? 'Space Grotesk Light' : 'Times Italic';
                const count = `${String(i).padStart(2, '0')} / ${String(WORDS.length).padStart(2, '0')}`;
                const label = document.createElement('b');
                const rest = it.kind === 'brand'
                    ? ` · 4 glyphs · ${width} units wide · ${face}`
                    : ` · ${it.text} · ${it.text.length} glyphs · ${width} units wide · ${face}`;
                label.textContent = it.kind === 'brand' ? 'AKAI' : count;
                readout.replaceChildren(label, rest);
            };

            const cycle = () => {
                show(index);
                const brand = items[index].kind === 'brand';
                const D = brand ? 5200 : 5600;
                dimline.style.opacity = 0;
                const a = word.animate([
                    { strokeDashoffset: 4000, fillOpacity: 0, offset: 0, easing: 'cubic-bezier(0.16, 1, 0.3, 1)' },
                    { strokeDashoffset: 0, fillOpacity: 0, offset: 0.3, easing: 'ease' },
                    { strokeDashoffset: 0, fillOpacity: 1, offset: 0.42 },
                    { strokeDashoffset: 0, fillOpacity: 1, offset: brand ? 0.8 : 0.76, easing: 'ease' },
                    { strokeDashoffset: 0, fillOpacity: 0, offset: brand ? 0.85 : 0.82, easing: 'cubic-bezier(0.7, 0, 0.84, 0)' },
                    { strokeDashoffset: -4000, fillOpacity: 0, offset: 1 }
                ], { duration: D, fill: 'both' });
                setTimeout(() => { dimline.style.opacity = 1; }, 1700);
                a.onfinish = () => { index = (index + 1) % items.length; cycle(); };
            };

            const start = () => {
                if (reduced) {
                    word.style.strokeDashoffset = 0; word.style.fillOpacity = 1;
                    show(0); dimline.style.opacity = 1;
                    setInterval(() => { index = (index + 1) % items.length; show(index); }, 3200);
                } else {
                    cycle();
                }
            };

            (document.fonts ? Promise.all([document.fonts.load('300 100px "Space Grotesk"'), document.fonts.ready]) : Promise.resolve()).then(start);

            const clock = $('clock');
            const fmt = new Intl.DateTimeFormat('en-US', { timeZone: 'America/Santo_Domingo', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
            const tick = () => { clock.textContent = fmt.format(new Date()) + ' AST'; };
            tick();
            setInterval(tick, 15000);
        })();
    </script>
</body>
</html>
