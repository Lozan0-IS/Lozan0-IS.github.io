<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hero model 6 — Portal — AKAI</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="/heroes/base.css">
    <style>
        /* Your own icon is the window. Two dot grids drift against each other behind it and the moiré shifts with the pointer,
           so the mark reads as depth. Swap the pattern for a film or a photograph and the same frame becomes the showreel. */
        body { background: #000; color: #fff; }

        .hero { position: relative; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 5rem var(--pad) 5.5rem; overflow: hidden; }

        .top { position: absolute; inset: 1.25rem var(--pad) auto; display: flex; justify-content: space-between; align-items: center; min-height: 44px; }
        .logo { font-size: 1rem; letter-spacing: 0.02em; }

        .portal {
            --size: min(62vh, 78vw);
            position: relative;
            width: var(--size);
            aspect-ratio: 1;
            overflow: hidden;
            background: #000;
            -webkit-mask-image: url('/assets/akai-icon.png');
            mask-image: url('/assets/akai-icon.png');
            -webkit-mask-size: 100% 100%;
            mask-size: 100% 100%;
            -webkit-mask-mode: luminance;
            mask-mode: luminance;
            transition: transform 700ms var(--ease-out);
        }

        .layer { position: absolute; inset: -30%; transition: transform 500ms var(--ease-out); }

        .layer--a {
            background: radial-gradient(circle, #fff 1.4px, transparent 1.9px) 0 0 / 10px 10px;
            animation: drift-a 40s linear infinite;
        }

        .layer--b {
            background: radial-gradient(circle, #fff 1.4px, transparent 1.9px) 0 0 / 10.7px 10.7px;
            mix-blend-mode: difference;
            animation: drift-b 55s linear infinite reverse;
        }

        @keyframes drift-a { to { transform: rotate(360deg); } }
        @keyframes drift-b { to { transform: rotate(-360deg); } }

        /* Pointer parallax lives on a wrapper so it does not fight the spin */
        .parallax { position: absolute; inset: 0; transform: translate(calc(var(--px, 0) * 22px), calc(var(--py, 0) * 22px)); transition: transform 400ms var(--ease-out); }

        .rail { list-style: none; position: absolute; top: 50%; display: grid; gap: 0.6rem; color: rgba(255, 255, 255, 0.6); transform: translateY(-50%); }
        .rail--l { left: var(--pad); }
        .rail--r { right: var(--pad); text-align: right; }
        .rail b { font-weight: 400; color: #fff; }

        .caption { position: absolute; left: var(--pad); bottom: clamp(1.25rem, 4vh, 3rem); max-width: 16ch; font-family: var(--font-serif); font-size: clamp(1.5rem, 3vw, 3rem); line-height: 1; letter-spacing: -0.05em; }

        .links { position: fixed; right: var(--pad); bottom: 1rem; display: flex; gap: 20px; mix-blend-mode: difference; color: #fff; z-index: 10; }

        @media (max-width: 760px) {
            .rail { display: none; }
            .caption { max-width: 12ch; }
        }

        @media (prefers-reduced-motion: reduce) {
            .layer--a, .layer--b { animation: none; }
        }
    </style>
</head>
<body>
    <main class="hero" id="hero">
        <header class="top">
            <a class="logo" href="/heroes/" aria-label="AKAI">AKAI</a>
            <p class="mono" style="color:rgba(255,255,255,.6)">Creative Intelligence Studio</p>
        </header>

        <h1 class="sr-only">AKAI</h1>

        <div class="portal" role="img" aria-label="The AKAI icon, a window onto a shifting dot pattern">
            <div class="parallax" id="parallax">
                <div class="layer layer--a"></div>
                <div class="layer layer--b"></div>
            </div>
        </div>

        <ol class="rail rail--l mono" aria-label="How we work"><li><b>01</b> Think</li><li><b>02</b> Shape</li><li><b>03</b> Build</li><li><b>04</b> Move</li></ol>
        <p class="rail rail--r mono"><span>Est. 2024</span><span>Santiago, DR</span></p>
        <p class="caption">Technology is our medium.</p>
    </main>

    <nav class="links" aria-label="Main">
        <a class="ghost" href="/#studio">Studio</a>
        <a class="ghost" href="/#contact">Contact</a>
    </nav>
    <a class="back mono" href="/heroes/">← All models</a>

    <script>
        (() => {
            if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            const hero = document.getElementById('hero');
            const p = document.getElementById('parallax');
            hero.addEventListener('pointermove', (e) => {
                const r = hero.getBoundingClientRect();
                p.style.setProperty('--px', ((e.clientX - r.left) / r.width - 0.5) * 2);
                p.style.setProperty('--py', ((e.clientY - r.top) / r.height - 0.5) * 2);
            });
        })();
    </script>
</body>
</html>
