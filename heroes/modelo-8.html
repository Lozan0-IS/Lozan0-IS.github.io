<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hero model 8 — Blueprint — AKAI</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="/heroes/base.css">
    <style>
        /* The name is drawn like a technical drawing: guides first, then the outline, then it fills.
           The numbers in the margin are measured from the drawing itself, not typed in. */
        body { background: #000; color: #fff; }

        .hero { position: relative; min-height: 100vh; min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; padding: 1.25rem var(--pad) 4.5rem; overflow: hidden; }

        .top { display: flex; justify-content: space-between; align-items: center; min-height: 44px; z-index: 2; }
        .logo { font-size: 1rem; letter-spacing: 0.02em; }
        .top p { color: rgba(255, 255, 255, 0.6); }

        .drawing { align-self: center; width: 100%; height: auto; max-height: 70vh; overflow: visible; }

        .guide { stroke: rgba(255, 255, 255, 0.28); stroke-width: 1; stroke-dasharray: 2400; stroke-dashoffset: 2400; animation: draw 1.4s var(--ease-out) forwards; }
        .guide--2 { animation-delay: 0.15s; }
        .guide--3 { animation-delay: 0.3s; }
        .guide--4 { animation-delay: 0.45s; }
        .arc { fill: none; stroke: rgba(255, 255, 255, 0.18); stroke-width: 1; stroke-dasharray: 3000; stroke-dashoffset: 3000; animation: draw 2.2s 0.5s var(--ease-out) forwards; }

        .glyphs { font-family: var(--font); font-weight: 300; letter-spacing: -0.06em; fill: #fff; fill-opacity: 0; stroke: #fff; stroke-width: 1.6; stroke-dasharray: 3400; stroke-dashoffset: 3400; animation: draw 2.4s 0.7s var(--ease-out) forwards, fill 1.1s 2.7s ease forwards; }

        .tick { font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; fill: rgba(255, 255, 255, 0.6); opacity: 0; animation: show 0.6s 2.4s ease forwards; }
        .dim { stroke: rgba(255, 255, 255, 0.5); stroke-width: 1; opacity: 0; animation: show 0.6s 2.4s ease forwards; }

        @keyframes draw { to { stroke-dashoffset: 0; } }
        @keyframes fill { to { fill-opacity: 1; } }
        @keyframes show { to { opacity: 1; } }

        .meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem; color: rgba(255, 255, 255, 0.6); }
        .replay { background: none; border: 0; color: inherit; cursor: pointer; min-height: 44px; padding: 0; }

        .links { position: fixed; right: var(--pad); bottom: 1rem; display: flex; gap: 20px; mix-blend-mode: difference; color: #fff; z-index: 10; }

        @media (prefers-reduced-motion: reduce) {
            .guide, .arc, .glyphs { stroke-dashoffset: 0; }
            .glyphs { fill-opacity: 1; }
            .tick, .dim { opacity: 1; }
        }
    </style>
</head>
<body>
    <main class="hero">
        <header class="top">
            <a class="logo" href="/heroes/" aria-label="AKAI">AKAI</a>
            <p class="mono">Creative Intelligence Studio</p>
        </header>

        <h1 class="sr-only">AKAI</h1>
        <svg class="drawing" id="drawing" viewBox="0 0 1440 560" aria-hidden="true" focusable="false">
            <!-- guides: cap height, x-height line, baseline, left margin -->
            <line class="guide" x1="0" y1="90" x2="1440" y2="90"/>
            <line class="guide guide--2" x1="0" y1="300" x2="1440" y2="300"/>
            <line class="guide guide--3" x1="0" y1="440" x2="1440" y2="440"/>
            <line class="guide guide--4" x1="60" y1="0" x2="60" y2="560"/>
            <circle class="arc" cx="720" cy="440" r="440"/>
            <circle class="arc" cx="720" cy="440" r="260"/>

            <text class="glyphs" id="glyphs" x="60" y="440" font-size="520">AKAI</text>

            <g id="dims"></g>
            <text class="tick" x="1380" y="84" text-anchor="end">Cap height</text>
            <text class="tick" x="1380" y="294" text-anchor="end">Midline</text>
            <text class="tick" x="1380" y="434" text-anchor="end">Baseline</text>
        </svg>

        <div class="meta mono">
            <span id="readout">4 glyphs</span>
            <button class="replay mono" id="replay" type="button">Redraw ↻</button>
        </div>
    </main>

    <nav class="links" aria-label="Main">
        <a class="ghost" href="/#studio">Studio</a>
        <a class="ghost" href="/#contact">Contact</a>
    </nav>
    <a class="back mono" href="/heroes/">← All models</a>

    <script>
        (() => {
            const svg = document.getElementById('drawing');
            const glyphs = document.getElementById('glyphs');
            const dims = document.getElementById('dims');
            const readout = document.getElementById('readout');
            const NS = 'http://www.w3.org/2000/svg';

            // Once the font is in, measure the drawn name and annotate it with its real width and height
            const annotate = () => {
                const b = glyphs.getBBox();
                const w = Math.round(b.width);
                dims.innerHTML = '';
                const add = (tag, attrs, cls) => { const el = document.createElementNS(NS, tag); Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v)); if (cls) el.setAttribute('class', cls); dims.append(el); return el; };
                const y = 500;
                add('line', { x1: b.x, y1: y, x2: b.x + b.width, y2: y }, 'dim');
                add('line', { x1: b.x, y1: y - 8, x2: b.x, y2: y + 8 }, 'dim');
                add('line', { x1: b.x + b.width, y1: y - 8, x2: b.x + b.width, y2: y + 8 }, 'dim');
                const label = add('text', { x: b.x + b.width / 2, y: y + 30, 'text-anchor': 'middle' }, 'tick');
                label.textContent = `${w} units`;
                readout.textContent = `4 glyphs · ${w} units wide · Space Grotesk Light`;
            };

            (document.fonts ? document.fonts.load('300 100px "Space Grotesk"').then(() => document.fonts.ready) : Promise.resolve()).then(annotate);

            // Redraw: restart every animation in the drawing
            document.getElementById('replay').addEventListener('click', () => {
                const items = svg.querySelectorAll('.guide, .arc, .glyphs, .tick, .dim');
                items.forEach((el) => { el.style.animation = 'none'; });
                void svg.getBoundingClientRect();
                items.forEach((el) => { el.style.animation = ''; });
            });
        })();
    </script>
</body>
</html>
