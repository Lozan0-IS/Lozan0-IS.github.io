<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hero model 5 — Prompt — AKAI</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="/heroes/base.css">
    <style>
        /* The hero is a question, not a poster. Picking a chip or typing writes the brief; Send opens the email.
           It is a form, not a chatbot: nothing here pretends to answer. */
        body { background: #000; color: #fff; }

        .hero { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; padding: 1.25rem var(--pad) 4.5rem; }

        .top { display: flex; justify-content: space-between; align-items: center; min-height: 44px; }
        .logo { font-size: 1rem; letter-spacing: 0.02em; }
        .top p { color: rgba(255, 255, 255, 0.6); }

        .center { align-self: center; width: min(62rem, 100%); }

        .kicker { color: rgba(255, 255, 255, 0.6); margin-bottom: 1.25rem; }

        h1 { font-size: clamp(2.75rem, 8.2vw, 8rem); font-weight: 300; line-height: 0.95; letter-spacing: -0.055em; min-height: 2em; }

        .caret { display: inline-block; width: 0.07em; height: 0.82em; margin-left: 0.06em; vertical-align: -0.05em; background: currentColor; animation: blink 1.05s steps(1) infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        .field { margin-top: clamp(1.5rem, 4vh, 3rem); display: flex; align-items: flex-end; gap: 1rem; border-bottom: 1px solid rgba(255, 255, 255, 0.4); transition: border-color 200ms ease; }
        .field:focus-within { border-bottom-color: #fff; }
        .field textarea { flex: 1; min-height: 3.2rem; max-height: 9rem; padding: 0.75rem 0; font: inherit; font-size: max(1.125rem, 1.6vw); line-height: 1.35; color: #fff; background: transparent; border: 0; border-radius: 0; resize: none; outline: none; }
        .field textarea::placeholder { color: rgba(255, 255, 255, 0.45); }
        .send { flex-shrink: 0; min-height: 44px; margin-bottom: 0.4rem; padding: 0 0.25rem; font: inherit; font-size: 1rem; color: #fff; background: none; border: 0; cursor: pointer; }
        .send:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }

        .chips { margin-top: 1.25rem; display: flex; flex-wrap: wrap; gap: 0.5rem; list-style: none; }
        .chip { min-height: 44px; padding: 0 1rem; font: inherit; font-size: 0.9375rem; color: #fff; background: none; border: 1px solid rgba(255, 255, 255, 0.32); border-radius: 999px; cursor: pointer; transition: background-color 150ms ease, color 150ms ease, border-color 150ms ease; }
        .chip[aria-pressed="true"] { background: #fff; color: #000; border-color: #fff; }
        .chip:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
        .chip:active { transform: scale(0.97); }
        @media (hover: hover) and (pointer: fine) { .chip:hover { border-color: #fff; } }

        .note { margin-top: 1.25rem; min-height: 1.5em; color: rgba(255, 255, 255, 0.6); }

        .links { position: fixed; right: var(--pad); bottom: 1rem; display: flex; gap: 20px; mix-blend-mode: difference; color: #fff; }
    </style>
</head>
<body>
    <main class="hero">
        <header class="top">
            <a class="logo" href="/heroes/" aria-label="AKAI">AKAI</a>
            <p class="mono">Creative Intelligence Studio</p>
        </header>

        <section class="center" aria-label="Start a project">
            <p class="kicker mono">New project</p>
            <h1 id="q" aria-label="What do you want to create?">What do you want to create?<span class="caret" aria-hidden="true"></span></h1>

            <form class="field" id="form" action="mailto:hello@akai.do" method="post" enctype="text/plain">
                <label class="sr-only" for="msg">Describe what you want to create</label>
                <textarea id="msg" name="msg" rows="1" placeholder="Describe it in a line or two…"></textarea>
                <button class="send" type="submit">Send →</button>
            </form>

            <ul class="chips" aria-label="Or start from a discipline">
                <li><button class="chip" type="button" data-t="A brand or creative direction for ">Brand &amp; Creative</button></li>
                <li><button class="chip" type="button" data-t="A website or digital experience for ">Digital Experience</button></li>
                <li><button class="chip" type="button" data-t="A product, platform or internal tool for ">Product or tool</button></li>
                <li><button class="chip" type="button" data-t="Automation or an intelligent system for ">Automation</button></li>
                <li><button class="chip" type="button" data-t="I'm not sure yet, but I want to ">Not sure yet</button></li>
            </ul>
            <p class="note mono" id="note" role="status" aria-live="polite">We start with the idea, not the stack.</p>
        </section>
    </main>

    <nav class="links" aria-label="Main">
        <a class="ghost" href="/#studio">Studio</a>
        <a class="ghost" href="/#contact">Contact</a>
    </nav>
    <a class="back mono" href="/heroes/">← All models</a>

    <script>
        (() => {
            const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
            const q = document.getElementById('q');
            const msg = document.getElementById('msg');
            const note = document.getElementById('note');
            const chips = [...document.querySelectorAll('.chip')];
            const caret = q.querySelector('.caret');
            const full = 'What do you want to create?';

            // The headline types itself once; the full text is already there for assistive tech and no-JS
            if (!reduced) {
                q.firstChild.textContent = '';
                let i = 0;
                const type = () => { q.firstChild.textContent = full.slice(0, ++i); if (i < full.length) setTimeout(type, 38 + Math.random() * 40); };
                setTimeout(type, 400);
            }

            let typing;
            const write = (text) => {
                clearInterval(typing);
                if (reduced) { msg.value = text; msg.focus(); return; }
                msg.value = '';
                let n = 0;
                typing = setInterval(() => {
                    msg.value = text.slice(0, ++n);
                    if (n >= text.length) { clearInterval(typing); msg.focus(); }
                }, 22);
            };

            chips.forEach((chip) => chip.addEventListener('click', () => {
                chips.forEach((c) => c.setAttribute('aria-pressed', String(c === chip)));
                write(chip.dataset.t);
                note.textContent = 'Finish the sentence, then send it.';
            }));

            document.getElementById('form').addEventListener('submit', (e) => {
                e.preventDefault();
                const text = msg.value.trim();
                if (!text) { note.textContent = 'Write a line first, even a rough one.'; msg.focus(); return; }
                const chosen = chips.find((c) => c.getAttribute('aria-pressed') === 'true');
                const subject = 'New project' + (chosen ? ': ' + chosen.textContent.trim() : '');
                location.href = 'mailto:hello@akai.do?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent('Hi AKAI,\n\n' + text);
                note.textContent = 'Your email app should open with this written. Nothing opened? Write to hello@akai.do.';
            });
        })();
    </script>
</body>
</html>
