<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hero model 7 — Sentence — AKAI</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="/heroes/base.css">
    <style>
        /* One sentence, and the word in the middle keeps changing. It says what AKAI makes without a services list.
           The hero is only type: no name poster, no image. Quiet on purpose. */
        body { background: #000; color: #fff; }

        .hero { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; padding: 1.25rem var(--pad) 4.5rem; }

        .top { display: flex; justify-content: space-between; align-items: center; min-height: 44px; }
        .logo { font-size: 1rem; letter-spacing: 0.02em; }
        .top p { color: rgba(255, 255, 255, 0.6); }

        .sentence { align-self: center; font-family: var(--font-serif); font-weight: 400; font-size: clamp(2.75rem, 9.2vw, 10.5rem); line-height: 0.98; letter-spacing: -0.055em; }

        .line { display: block; }

        /* The slot clips each word and slides the next one up under it */
        .slot { position: relative; display: inline-block; overflow: hidden; vertical-align: top; height: 1.02em; }
        .slot__track { display: block; transition: transform 700ms var(--ease-out); }
        .slot__word { display: block; height: 1.02em; white-space: nowrap; font-style: italic; }

        .meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem; color: rgba(255, 255, 255, 0.6); }

        .links { position: fixed; right: var(--pad); bottom: 1rem; display: flex; gap: 20px; mix-blend-mode: difference; color: #fff; z-index: 10; }
    </style>
</head>
<body>
    <main class="hero">
        <header class="top">
            <a class="logo" href="/heroes/" aria-label="AKAI">AKAI</a>
            <p class="mono">Creative Intelligence Studio</p>
        </header>

        <h1 class="sentence" aria-label="We build brands. Technology is our medium. The experience is the result.">
            <span class="line">We build</span>
            <span class="line"><span class="slot" aria-hidden="true"><span class="slot__track" id="track">
                <span class="slot__word">brands.</span>
                <span class="slot__word">websites.</span>
                <span class="slot__word">platforms.</span>
                <span class="slot__word">automations.</span>
                <span class="slot__word">experiences.</span>
                <span class="slot__word">brands.</span>
            </span></span></span>
        </h1>

        <div class="meta mono">
            <span>Technology is our medium. The experience is the result.</span>
            <span>Santiago, DR · <time id="clock"></time></span>
        </div>
    </main>

    <nav class="links" aria-label="Main">
        <a class="ghost" href="/#studio">Studio</a>
        <a class="ghost" href="/#contact">Contact</a>
    </nav>
    <a class="back mono" href="/heroes/">← All models</a>

    <script>
        (() => {
            const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
            const track = document.getElementById('track');
            const words = track.children.length - 1; // the last word repeats the first, so the loop never rewinds visibly
            let i = 0;

            if (!reduced) {
                setInterval(() => {
                    i++;
                    track.style.transform = `translateY(${-i * 1.02}em)`;
                    if (i === words) {
                        setTimeout(() => {
                            track.style.transition = 'none';
                            track.style.transform = 'translateY(0)';
                            i = 0;
                            void track.offsetHeight;
                            track.style.transition = '';
                        }, 720);
                    }
                }, 2200);
            }

            const clock = document.getElementById('clock');
            const fmt = new Intl.DateTimeFormat('en-US', { timeZone: 'America/Santo_Domingo', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
            const tick = () => { clock.textContent = fmt.format(new Date()) + ' AST'; };
            tick();
            setInterval(tick, 15000);
        })();
    </script>
</body>
</html>
